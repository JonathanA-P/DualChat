<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" style="background:#ffffff;font-family:system-ui,-apple-system,sans-serif;">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="2" y="2" width="696" height="376" fill="none" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <!-- Title -->
  <text x="350" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Analisis Header Overhead (%): TCP (20B) vs UDP (8B)</text>
  <text x="350" y="58" text-anchor="middle" font-size="12" fill="#64748b">Persentase Beban Header Terhadap Total Ukuran Paket di Layer Transport</text>

  <!-- Legend -->
  <line x1="220" y1="84" x2="245" y2="84" stroke="#10b981" stroke-width="3"/>
  <circle cx="232" cy="84" r="4" fill="#10b981"/>
  <text x="252" y="88" font-size="12" font-weight="600" fill="#334155">TCP Header (Min 20 Bytes)</text>

  <line x1="420" y1="84" x2="445" y2="84" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="432" cy="84" r="4" fill="#f59e0b"/>
  <text x="452" y="88" font-size="12" font-weight="600" fill="#334155">UDP Header (Fixed 8 Bytes)</text>

  <!-- Gridlines -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="80" y1="270" x2="640" y2="270" stroke="#cbd5e1"/>
    <line x1="80" y1="225" x2="640" y2="225"/>
    <line x1="80" y1="180" x2="640" y2="180"/>
    <line x1="80" y1="135" x2="640" y2="135"/>
    <line x1="80" y1="90" x2="640" y2="90"/>
  </g>

  <!-- Y-Axis labels (% Overhead) -->
  <text x="70" y="274" text-anchor="end" font-size="11" fill="#94a3b8">0%</text>
  <text x="70" y="229" text-anchor="end" font-size="11" fill="#94a3b8">10%</text>
  <text x="70" y="184" text-anchor="end" font-size="11" fill="#94a3b8">20%</text>
  <text x="70" y="139" text-anchor="end" font-size="11" fill="#94a3b8">30%</text>
  <text x="70" y="94" text-anchor="end" font-size="11" fill="#94a3b8">40%</text>

  <!-- Paths -->
  <path d="M 100,131.5 L 185,184.3 L 270,221.4 L 355,243.9 L 440,256.5 L 525,263.1 L 610,266.5" fill="none" stroke="#10b981" stroke-width="3"/>
  <path d="M 100,198.0 L 185,230.0 L 270,248.8 L 355,259.1 L 440,264.5 L 525,267.2 L 610,268.6" fill="none" stroke="#f59e0b" stroke-width="3"/>

  <!-- Points and X Labels -->

  <!-- Size 32B -->
  <text x="100" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">32B</text>
  <circle cx="100" cy="131.5" r="4" fill="#10b981"/>
  <text x="100" y="123.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">38.5%</text>

  <circle cx="100" cy="198.0" r="4" fill="#f59e0b"/>
  <text x="100" y="213.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">20.0%</text>

  <!-- Size 64B -->
  <text x="185" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">64B</text>
  <circle cx="185" cy="184.3" r="4" fill="#10b981"/>
  <text x="185" y="176.3" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">23.8%</text>

  <circle cx="185" cy="230.0" r="4" fill="#f59e0b"/>
  <text x="185" y="245.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">11.1%</text>

  <!-- Size 128B -->
  <text x="270" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">128B</text>
  <circle cx="270" cy="221.4" r="4" fill="#10b981"/>
  <text x="270" y="213.4" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">13.5%</text>

  <circle cx="270" cy="248.8" r="4" fill="#f59e0b"/>
  <text x="270" y="263.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">5.9%</text>

  <!-- Size 256B -->
  <text x="355" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">256B</text>
  <circle cx="355" cy="243.9" r="4" fill="#10b981"/>
  <text x="355" y="235.9" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">7.2%</text>

  <circle cx="355" cy="259.1" r="4" fill="#f59e0b"/>
  <text x="355" y="274.1" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">3.0%</text>

  <!-- Size 512B -->
  <text x="440" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">512B</text>
  <circle cx="440" cy="256.5" r="4" fill="#10b981"/>
  <text x="440" y="248.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">3.8%</text>

  <circle cx="440" cy="264.5" r="4" fill="#f59e0b"/>
  <text x="440" y="279.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">1.5%</text>

  <!-- Size 1024B -->
  <text x="525" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">1024B</text>
  <circle cx="525" cy="263.1" r="4" fill="#10b981"/>
  <text x="525" y="255.1" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">1.9%</text>

  <circle cx="525" cy="267.2" r="4" fill="#f59e0b"/>
  <text x="525" y="282.2" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">0.8%</text>

  <!-- Size 2048B -->
  <text x="610" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">2048B</text>
  <circle cx="610" cy="266.5" r="4" fill="#10b981"/>
  <text x="610" y="258.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">1.0%</text>

  <circle cx="610" cy="268.6" r="4" fill="#f59e0b"/>
  <text x="610" y="283.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">0.4%</text>

  <!-- Footer Note -->
  <text x="350" y="348" text-anchor="middle" font-size="11" fill="#64748b">Pada payload kecil (32-64B seperti pesan chat singkat), UDP menghemat hingga 2.5x overhead dibanding TCP.</text>
</svg>
