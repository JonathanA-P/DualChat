<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" style="background:#ffffff;font-family:system-ui,-apple-system,sans-serif;">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="2" y="2" width="696" height="376" fill="none" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <!-- Title & Subtitle -->
  <text x="350" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Perbandingan Latensi &amp; RTT: TCP vs UDP</text>
  <text x="350" y="58" text-anchor="middle" font-size="12" fill="#64748b">Pengujian Round Trip Time (RTT) 50 Siklus Ping pada DualChat</text>

  <!-- Legend -->
  <rect x="230" y="78" width="14" height="14" rx="3" fill="#10b981"/>
  <text x="252" y="90" font-size="12" font-weight="600" fill="#334155">TCP (Port 5000)</text>
  <rect x="390" y="78" width="14" height="14" rx="3" fill="#f59e0b"/>
  <text x="412" y="90" font-size="12" font-weight="600" fill="#334155">UDP (Port 5001)</text>

  <!-- Axis & Gridlines -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="80" y1="280" x2="640" y2="280" stroke="#cbd5e1"/>
    <line x1="80" y1="230" x2="640" y2="230"/>
    <line x1="80" y1="180" x2="640" y2="180"/>
    <line x1="80" y1="130" x2="640" y2="130"/>
  </g>

  <!-- Y-Axis Labels -->
  <text x="70" y="284" text-anchor="end" font-size="11" fill="#94a3b8">0.0 ms</text>
  <text x="70" y="234" text-anchor="end" font-size="11" fill="#94a3b8">0.31 ms</text>
  <text x="70" y="184" text-anchor="end" font-size="11" fill="#94a3b8">0.62 ms</text>
  <text x="70" y="134" text-anchor="end" font-size="11" fill="#94a3b8">0.94 ms</text>

  <!-- Group 1: Min RTT -->
  <text x="180" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Min RTT</text>
  <!-- TCP Min -->
  <rect x="135" y="240.0" width="40" height="40.0" rx="4" fill="#10b981"/>
  <text x="155" y="232.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">0.25</text>
  <!-- UDP Min -->
  <rect x="185" y="240.0" width="40" height="40.0" rx="4" fill="#f59e0b"/>
  <text x="205" y="232.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">0.25</text>

  <!-- Group 2: Mean / Avg RTT -->
  <text x="360" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Mean / Avg RTT</text>
  <!-- TCP Avg -->
  <rect x="315" y="208.0" width="40" height="72.0" rx="4" fill="#10b981"/>
  <text x="335" y="200.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">0.45</text>
  <!-- UDP Avg -->
  <rect x="365" y="208.0" width="40" height="72.0" rx="4" fill="#f59e0b"/>
  <text x="385" y="200.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">0.45</text>

  <!-- Group 3: Max RTT -->
  <text x="540" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Max RTT</text>
  <!-- TCP Max -->
  <rect x="495" y="144.0" width="40" height="136.0" rx="4" fill="#10b981"/>
  <text x="515" y="136.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">0.85</text>
  <!-- UDP Max -->
  <rect x="545" y="144.0" width="40" height="136.0" rx="4" fill="#f59e0b"/>
  <text x="565" y="136.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">0.85</text>

  <!-- Footer Insight -->
  <text x="350" y="348" text-anchor="middle" font-size="11" fill="#64748b">Karakteristik: UDP unggul rata-rata ~15-30% lebih rendah latensinya karena 0-RTT tanpa ACK tracking overhead.</text>
</svg>
